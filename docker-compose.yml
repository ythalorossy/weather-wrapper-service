# docker-compose.yml — local dev stack
#
# Brings up:
#   - weather-api:  Spring Boot service on :8080
#   - redis:        Cache backend on :6379
#
# Run:   docker compose up --build
# Stop:  docker compose down

services:
  weather-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: weather-wrapper-service:local
    container_name: weather-wrapper-service
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: weather-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
    driver: local