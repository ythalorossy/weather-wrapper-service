spring:
  application:
    name: weather-wrapper-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  threads:
    virtual:
      # Java 21 virtual threads (Project Loom) — Tomcat uses them for
      # request handling, so blocking I/O on RestClient/etc. parks cheaply
      # instead of holding an OS thread. Throughput for I/O-bound paths
      # approaches reactive levels with zero code change.
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      access: read_only
  prometheus:
    metrics:
      export:
        enabled: true

weather:
  cache-ttl: 12h
  observation-ttl: 10m
  alert-ttl: 5m
  provider:
    base-url: https://api.weather.gov
    user-agent: weather-wrapper-service/0.1.0 (https://github.com/ythalorossy/weather-wrapper-service)
    timeout: 10s
  geocoding:
    base-url: https://nominatim.openstreetmap.org
    user-agent: weather-wrapper-service/0.1.0 (https://github.com/ythalorossy/weather-wrapper-service)
    timeout: 5s
    cache-ttl: 720h        # 30 days for positive results
    absent-ttl: 60s        # 60 seconds for negative results ("no such city")
  sun-ttl: 48h
  afd-ttl: 30m
  rate-limit:
    burst:
      capacity: 5
      refill-period-seconds: 1
    sustained:
      capacity: 60
      refill-period-seconds: 60

logging:
  level:
    io.ythalorossy.weatherapi: DEBUG
    org.springframework.web.client: INFO